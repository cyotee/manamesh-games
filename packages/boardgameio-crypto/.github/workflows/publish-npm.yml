name: Publish npm

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm install
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install -g npm@latest
      - run: npm install
      - run: npm run build || test -f dist/index.js
      - name: Prepare package.json for publish
        run: |
          node -e "
            const fs=require('fs');
            const j=JSON.parse(fs.readFileSync('package.json','utf8'));
            delete j.private;
            if (j.devDependencies) delete j.devDependencies['boardgame.io'];
            j.publishConfig = Object.assign({access:'public'}, j.publishConfig||{});
            fs.writeFileSync('package.json', JSON.stringify(j,null,2)+'\n');
          "
      - name: Publish if new version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "Already published $NAME@$VER"
            exit 0
          fi
          npm publish --access public
